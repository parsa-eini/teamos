# Team-OS — production nginx site
#
# Hosts:
#   team-os.ir / www.team-os.ir  →  website  (127.0.0.1:5173)
#   panel.team-os.ir             →  panel    (127.0.0.1:5174)
#   api.team-os.ir               →  FastAPI  (127.0.0.1:8000)
#
# This file includes HTTPS. Obtain certificates BEFORE enabling it, or nginx
# will fail to start because the .pem paths below will not exist.
#
# ---------------------------------------------------------------------------
# First-time install
# ---------------------------------------------------------------------------
# 1. DNS A/AAAA records for team-os.ir, www.team-os.ir, panel.team-os.ir,
#    and api.team-os.ir must already point at this server.
#
# 2. Issue the certificate (nothing else should be bound to :80):
#      sudo certbot certonly --standalone \
#        -d team-os.ir -d www.team-os.ir \
#        -d panel.team-os.ir -d api.team-os.ir
#
#    If nginx is already serving HTTP, use webroot instead:
#      sudo mkdir -p /var/www/certbot
#      sudo certbot certonly --webroot -w /var/www/certbot \
#        -d team-os.ir -d www.team-os.ir \
#        -d panel.team-os.ir -d api.team-os.ir
#
# 3. Install this site:
#      sudo mkdir -p /var/www/certbot
#      sudo cp deploy/nginx/team-os.ir.conf /etc/nginx/sites-available/team-os.ir
#      sudo ln -sf /etc/nginx/sites-available/team-os.ir /etc/nginx/sites-enabled/team-os.ir
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Renewals: certbot installs a timer. After each renewal, reload nginx:
#      echo '0 3 * * * root certbot renew --quiet --deploy-hook "systemctl reload nginx"' \
#        | sudo tee /etc/cron.d/certbot-reload
#
# ---------------------------------------------------------------------------
# Compose / app env on the host
# ---------------------------------------------------------------------------
# Bind Docker ports to loopback so they are not public:
#   "127.0.0.1:8000:8000"
#   "127.0.0.1:5173:5173"
#   "127.0.0.1:5174:5174"
#
#   CORS_ORIGINS=https://team-os.ir,https://panel.team-os.ir
#   VITE_API_BASE_URL=https://api.team-os.ir
#   VITE_PANEL_URL=https://panel.team-os.ir
#   VITE_WEBSITE_URL=https://team-os.ir
#
# Rebuild website and panel after changing VITE_* so the values are baked in.
#
# Open 80/443 only. Do not publish 5432 or 6379 on the public interface.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=teamos_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=teamos_auth:10m rate=5r/s;

upstream teamos_website {
    server 127.0.0.1:5173 fail_timeout=10s;
    keepalive 8;
}

upstream teamos_panel {
    server 127.0.0.1:5174 fail_timeout=10s;
    keepalive 8;
}

upstream teamos_api {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

# Shared TLS settings (Mozilla Intermediate). Included by every 443 server.
# Certificate is one SAN cert covering all four names (see certbot -d list).
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/team-os.ir/chain.pem;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# Catch-all: unknown Host headers never reach an app
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# ---------------------------------------------------------------------------
# HTTP: ACME + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name team-os.ir www.team-os.ir panel.team-os.ir api.team-os.ir;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www.team-os.ir → https://team-os.ir
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.team-os.ir;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/team-os.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-os.ir/privkey.pem;

    return 301 https://team-os.ir$request_uri;
}

# ---------------------------------------------------------------------------
# team-os.ir — public website
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name team-os.ir;

    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/team-os.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-os.ir/privkey.pem;

    access_log /var/log/nginx/team-os.ir.access.log;
    error_log  /var/log/nginx/team-os.ir.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://teamos_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering on;
    }
}

# ---------------------------------------------------------------------------
# panel.team-os.ir — authenticated app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.team-os.ir;

    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/team-os.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-os.ir/privkey.pem;

    access_log /var/log/nginx/panel.team-os.ir.access.log;
    error_log  /var/log/nginx/panel.team-os.ir.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://teamos_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering on;
    }
}

# ---------------------------------------------------------------------------
# api.team-os.ir — FastAPI  (/api/v1/... and /health)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.team-os.ir;

    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/team-os.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-os.ir/privkey.pem;

    access_log /var/log/nginx/api.team-os.ir.access.log;
    error_log  /var/log/nginx/api.team-os.ir.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/problem+json text/plain;

    location = /health {
        proxy_pass http://teamos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location /api/v1/auth/ {
        limit_req zone=teamos_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://teamos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        limit_req zone=teamos_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://teamos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
