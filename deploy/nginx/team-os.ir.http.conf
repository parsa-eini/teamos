# Team-OS — HTTP bootstrap (use only until TLS certificates exist)
#
# After certificates are issued, replace this with team-os.ir.conf:
#   sudo cp deploy/nginx/team-os.ir.conf /etc/nginx/sites-available/team-os.ir
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/team-os.ir.http.conf /etc/nginx/sites-available/team-os.ir
#   sudo ln -sf /etc/nginx/sites-available/team-os.ir /etc/nginx/sites-enabled/team-os.ir
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d team-os.ir -d www.team-os.ir \
#     -d panel.team-os.ir -d api.team-os.ir

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream teamos_website {
    server 127.0.0.1:5173 fail_timeout=10s;
}

upstream teamos_panel {
    server 127.0.0.1:5174 fail_timeout=10s;
}

upstream teamos_api {
    server 127.0.0.1:8000 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name team-os.ir www.team-os.ir;

    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://teamos_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.team-os.ir;

    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://teamos_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.team-os.ir;

    server_tokens off;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://teamos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
